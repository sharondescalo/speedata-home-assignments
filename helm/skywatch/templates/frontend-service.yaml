{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: skywatch-frontend
  labels:
    {{- include "skywatch.frontendSelector" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "skywatch.frontendSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      nodePort: {{ .Values.frontend.service.nodePort }}
{{- end }}
