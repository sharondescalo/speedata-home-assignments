apiVersion: v1
kind: Service
metadata:
  name: skywatch-backend
  labels:
    {{- include "skywatch.backendSelector" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "skywatch.backendSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
