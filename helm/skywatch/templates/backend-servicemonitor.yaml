{{- if and .Values.backend.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: skywatch-backend
  labels:
    {{- include "skywatch.backendSelector" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "skywatch.backendSelector" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
{{- end }}
