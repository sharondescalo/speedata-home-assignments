apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skywatch-frontend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/sharondescalo/speedata-home-assignments.git
    targetRevision: main
    path: helm/skywatch
    helm:
      values: |
        frontend:
          enabled: true
          ingress:
            enabled: true
        backend:
          enabled: false
        metrics:
          serviceMonitor:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
