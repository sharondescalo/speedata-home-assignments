apiVersion: v1
kind: ConfigMap
metadata:
  name: skywatch-dashboard
  labels:
    grafana_dashboard: "1"
data:
  skywatch.json: |
    {
      "uid": "skywatch",
      "title": "SkyWatch",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "type": "timeseries",
          "title": "Request rate",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(skywatch_http_requests_total[5m])) by (path, status)",
              "legendFormat": "{{path}} {{status}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latency p95",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "unit": "s" }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(skywatch_http_request_duration_seconds_bucket[5m])) by (le, path))",
              "legendFormat": "{{path}}"
            }
          ]
        }
      ]
    }
