name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/frontend/requirements.txt
      - run: pip install ruff
      - run: ruff check apps

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/frontend/requirements.txt
      - run: pip install -r apps/backend/requirements.txt -r apps/frontend/requirements.txt
      - run: python -m unittest discover -s tests -t .
        working-directory: apps/backend
      - run: python -m unittest discover -s tests -t .
        working-directory: apps/frontend

  images:
    if: github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: apps/frontend
          - name: backend
            context: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: REVISION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/skywatch-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  tags:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write the commit SHA into the Helm values
        env:
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          sha = os.environ["SHA"]
          path = Path("helm/skywatch/values.yaml")
          text = path.read_text()
          updated, count = re.subn(
              r'(?m)^(\s+tag:\s*)"(?:[^"]*)"$',
              rf'\1"{sha}"',
              text,
          )
          if count != 2:
              raise SystemExit(f"expected to replace 2 image tags, replaced {count}")
          path.write_text(updated)
          PY
      - name: Commit the image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/skywatch/values.yaml
          if git diff --cached --quiet; then
            echo "Image tags are already ${GITHUB_SHA}."
            exit 0
          fi
          git commit -m "chore: bump image tags to ${GITHUB_SHA} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
